[package]
name = "exit-sentinel"
version = "0.7.4"
description = "A private macOS, Windows and Linux split-route egress monitor"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks"] }
tokio = { version = "1", features = ["time", "sync", "macros", "net", "io-util"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
url = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

serde_yaml = "0.9"
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
# Linux stores the WebDAV password in the Secret Service (GNOME Keyring / KWallet).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
flate2 = "1"

# macOS: tray right-click handling (AppKit) and the Wi-Fi name (CoreWLAN, gated by Location Services).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSString", "NSNotification", "NSOperation", "NSTimer", "NSRunLoop", "NSDate", "NSObjCRuntime"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSMenu", "NSResponder"] }
objc2-core-wlan = { version = "0.3", default-features = false, features = ["std", "CWWiFiClient", "CWInterface"] }
objc2-core-location = { version = "0.3", default-features = false, features = ["std", "CLLocationManager", "CLLocationManagerDelegate"] }
